<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부자따라 부자되기</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- React와 ReactDOM 로드 -->
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>

  <!-- Babel 로드 (JSX 변환용) -->

  <!-- 아이콘 라이브러리 -->
  <script src="https://unpkg.com/lucide-react@latest"></script>

  <!-- 페이지 로드 -->
  <script type="text/babel" data-type="module" src="src/pages/HomePage.jsx"></script>
  <script type="text/babel" data-type="module" src="src/pages/DetailPage.jsx"></script>
  
  <!-- 메인 앱 파일 로드 -->
  <script type="text/babel" data-type="module" src="src/App.jsx"></script>

</html>
